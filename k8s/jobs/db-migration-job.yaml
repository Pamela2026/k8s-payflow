# ============================================
# DB MIGRATION JOB
# ============================================
# #### One-off migration job to create/update database schema. ####
# #### Safe to re-run when migrations change. ####
# #### One-time Flyway migration job ####
apiVersion: batch/v1
kind: Job
metadata:
  name: payflow-db-migration
  namespace: payflow
spec:
  # #### Clean up after completion ####
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: payflow-db-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-migration
        image: flyway/flyway:9.22.3
        # #### Database connection inputs ####
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_NAME
        - name: DB_USER
          valuesFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_PASSWORD
        # #### Flyway configuration ####
        - name: FLYWAY_LOCATIONS
          value: "filesystem:/migrations"
        - name: FLYWAY_BASELINE_ON_MIGRATE
          value: "true"
        command:
        - /bin/sh
        - -c
        args:
        - |
          # #### Build Flyway JDBC URL and apply migrations ####
          set -e
          export FLYWAY_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable"
          export FLYWAY_USER="$DB_USER"
          export FLYWAY_PASSWORD="$DB_PASSWORD"
          flyway -baselineOnMigrate=true -connectRetries=60 migrate

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

        volumeMounts:
        - name: db-migrations
          mountPath: /migrations
          readOnly: true
      volumes:
      - name: db-migrations
        # #### SQL scripts sourced from ConfigMap ####
        configMap:
          name: payflow-db-migrations
