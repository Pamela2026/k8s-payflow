# ============================================
# PROMETHEUS HELM VALUES
# ============================================
# #### Scrape config keeps only explicitly annotated services. ####

# ============================================
# ALERTMANAGER (ENABLED)
# ============================================
# #### Enabled to receive alerts from Prometheus rules. ####
alertmanager:
  enabled: true
  persistentVolume:
    enabled: true
    storageClass: gp2
    size: 2Gi
  extraSecretMounts:
    - name: alertmanager-slack
      secretName: alertmanager-slack
      mountPath: /etc/alertmanager/secrets/alertmanager-slack
      readOnly: true
  alertmanagerFiles:
    alertmanager.yml: |
      global:
        resolve_timeout: 5m
      route:
        receiver: "slack-default"
        group_by: ["alertname", "namespace", "service"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 3h
        routes:
          - receiver: "slack-critical"
            matchers:
              - severity="critical"
      receivers:
        - name: "slack-default"
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
              channel: "#alerts"
              send_resolved: true
              title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
              text: "{{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
        - name: "slack-critical"
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
              channel: "#alerts-critical"
              send_resolved: true
              title: "[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"
              text: "{{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

# ============================================
# PUSHGATEWAY (ENABLED)
# ============================================
# #### Enabled for short-lived jobs to push metrics (migrations, backups, handlers). ####
pushgateway:
  enabled: true

# ============================================
# KUBE-STATE-METRICS
# ============================================
# #### Collects Kubernetes object-state metrics (deployments, pods, requests/limits, etc.). ####
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ============================================
# NODE EXPORTER
# ============================================
# #### Collects node-level host metrics (CPU, memory, filesystem, network). ####
nodeExporter:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ============================================
# PROMETHEUS SERVER
# ============================================
# #### Core runtime settings including retention, storage, and scrape/eval intervals. ####
server:
  retention: "2d"
  # #### Persists TSDB data so pod restarts do not wipe metrics history. ####
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: gp2
  # #### CPU/memory envelope for Prometheus query + scrape workload. ####
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 400m
      memory: 1Gi
  # #### Default scrape and rule evaluation cadence. ####
  global:
    scrape_interval: 60s
    evaluation_interval: 60s
  # ============================================
  # #### SERVER FILES (INLINE CONFIG) ####
  # ============================================
  # #### Inline Prometheus config files packaged into the chart ConfigMap. ####
  # #### This deployment scrapes only services that explicitly opt in via annotations. ####
serverFiles:
  prometheus.yml:
    # #### Loads custom SLI/SLO recording and alerting rules from this same ConfigMap. ####
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
    # #### Kubernetes endpoint discovery + relabel pipeline for annotated service scraping. ####
    scrape_configs:
      - job_name: "payflow-kubernetes-service-endpoints"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
      - job_name: "blackbox-http"
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://api-gateway.payflow.svc.cluster.local:80/metrics
              - http://auth-service.payflow.svc.cluster.local:3004/metrics
              - http://wallet-service.payflow.svc.cluster.local:3001/metrics
              - http://transaction-service.payflow.svc.cluster.local:3002/metrics
              - http://notification-service.payflow.svc.cluster.local:3003/metrics
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - source_labels: [__param_target]
            target_label: service
            regex: http://([^\.]+)\..*
            replacement: $1
          - target_label: namespace
            replacement: payflow
          - target_label: __address__
            replacement: payflow-blackbox-exporter.monitoring.svc.cluster.local:9115
      - job_name: "pushgateway"
        honor_labels: true
        static_configs:
          - targets:
              - payflow-prometheus-pushgateway.monitoring.svc.cluster.local:9091
  # ============================================
  # #### RECORDING RULES ####
  # ============================================
  # #### Normalize current HTTP metrics into reusable SLI/SLO series. ####
  recording_rules.yml:
    groups:
      - name: payflow-sli-recording
        interval: 1m
        rules:
          # #### Prefer explicit request counter; fallback to histogram count where needed. ####
          - record: payflow:http_requests:rate5m
            expr: |
              sum by (namespace, service) (
                rate(http_requests_total[5m])
              )
              or
              sum by (namespace, service) (
                rate(http_request_duration_seconds_count[5m])
              )
          # #### Uses the same counter/histogram strategy as total request rate. ####
          - record: payflow:http_requests_errors:rate5m
            expr: |
              sum by (namespace, service) (
                rate(http_requests_total{status_code=~"5.."}[5m])
              )
              or
              sum by (namespace, service) (
                rate(http_request_duration_seconds_count{status_code=~"5.."}[5m])
              )
          # #### Same throughput series over a longer window for slow-burn calculations. ####
          - record: payflow:http_requests:rate1h
            expr: |
              sum by (namespace, service) (
                rate(http_requests_total[1h])
              )
              or
              sum by (namespace, service) (
                rate(http_request_duration_seconds_count[1h])
              )
          # #### Same error series over a longer window for slow-burn calculations. ####
          - record: payflow:http_requests_errors:rate1h
            expr: |
              sum by (namespace, service) (
                rate(http_requests_total{status_code=~"5.."}[1h])
              )
              or
              sum by (namespace, service) (
                rate(http_request_duration_seconds_count{status_code=~"5.."}[1h])
              )
          # #### Proportion of requests served in <= 500ms over 5 minutes. ####
          - record: payflow:sli_latency_le_500ms:ratio5m
            expr: |
              sum by (namespace, service) (
                rate(http_request_duration_seconds_bucket{le="0.5"}[5m])
              )
              /
              clamp_min(
                sum by (namespace, service) (
                  rate(http_request_duration_seconds_count[5m])
                ),
                0.001
              )
          # #### Error budget burn for 99.9% availability objective (budget = 0.001). ####
          - record: payflow:slo_error_budget_burn:ratio5m
            expr: |
              (
                payflow:http_requests_errors:rate5m
                /
                clamp_min(payflow:http_requests:rate5m, 0.001)
              ) / 0.001
          # #### Long-window burn rate used for slow-burn alerting. ####
          - record: payflow:slo_error_budget_burn:ratio1h
            expr: |
              (
                payflow:http_requests_errors:rate1h
                /
                clamp_min(payflow:http_requests:rate1h, 0.001)
              ) / 0.001
  # ============================================
  # #### ALERTING RULES ####
  # ============================================
  # #### Evaluate the recorded SLI/SLO series. ####
  alerting_rules.yml:
    groups:
      - name: payflow-slo-alerting
        rules:
          # #### Multi-window burn alert catches acute error-budget consumption. ####
          - alert: PayflowAvailabilityErrorBudgetBurnHigh
            expr: |
              sum by (namespace) (payflow:slo_error_budget_burn:ratio5m) > 14
              and
              sum by (namespace) (payflow:slo_error_budget_burn:ratio1h) > 14
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High SLO burn rate in namespace {{ $labels.namespace }}"
              description: "Availability error budget burn is high for both 5m and 1h windows."
          # #### Alerts when 1h availability stays below 99.9% target. ####
          - alert: PayflowAvailabilitySLIBelowTarget
            expr: |
              (
                1 - (
                  sum by (namespace) (payflow:http_requests_errors:rate1h)
                  /
                  clamp_min(sum by (namespace) (payflow:http_requests:rate1h), 0.001)
                )
              ) < 0.999
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "Availability SLI below 99.9% in namespace {{ $labels.namespace }}"
              description: "The 1h rolling availability is below the SLO target."
          # #### Alerts when <=500ms success ratio drops below 95%. ####
          - alert: PayflowLatencySLIBelowTarget
            expr: |
              (
                sum by (namespace) (
                  payflow:sli_latency_le_500ms:ratio5m * payflow:http_requests:rate5m
                )
                /
                clamp_min(sum by (namespace) (payflow:http_requests:rate5m), 0.001)
              ) < 0.95
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Latency SLI below 95% in namespace {{ $labels.namespace }}"
              description: "Less than 95% of requests are <= 500ms over the last 5 minutes."
      - name: payflow.slo-service
        rules:
          - alert: PayflowAvailabilityErrorBudgetBurnHighPerService
            expr: |
              payflow:slo_error_budget_burn:ratio5m > 14
              and on (namespace, service)
              payflow:slo_error_budget_burn:ratio1h > 14
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High SLO burn rate (service: {{ $labels.service }})"
              description: "Error budget is burning fast for service {{ $labels.service }} in {{ $labels.namespace }}."
      - name: payflow.availability
        rules:
          - alert: PayflowHighErrorRateWarning
            expr: |
              (
                sum by (service) (
                  rate(http_requests_total{namespace="payflow",status_code=~"5.."}[5m])
                )
                /
                clamp_min(
                  sum by (service) (
                    rate(http_requests_total{namespace="payflow"}[5m])
                  ),
                  0.001
                )
              ) > 0.02
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Payflow error rate > 2% (service: {{ $labels.service }})"
              description: "More than 2% of requests are returning 5xx errors for service {{ $labels.service }}."
          - alert: PayflowHighErrorRateCritical
            expr: |
              (
                sum by (service) (
                  rate(http_requests_total{namespace="payflow",status_code=~"5.."}[5m])
                )
                /
                clamp_min(
                  sum by (service) (
                    rate(http_requests_total{namespace="payflow"}[5m])
                  ),
                  0.001
                )
              ) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Payflow error rate > 5% (service: {{ $labels.service }})"
              description: "More than 5% of requests are failing for service {{ $labels.service }}. User impact likely."
      - name: payflow.latency
        rules:
          - alert: PayflowHighLatencyP95
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket{namespace="payflow"}[5m])) by (le, service)
              ) > 1.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency (p95 > 1.5s) (service: {{ $labels.service }})"
              description: "95th percentile latency is above 1.5 seconds for service {{ $labels.service }}."
      - name: payflow.stability
        rules:
          - alert: PayflowPodHighRestarts
            expr: increase(kube_pod_container_status_restarts_total{namespace="payflow"}[10m]) > 3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High pod restart rate"
              description: "Pods are restarting frequently in payflow namespace."
          - alert: PayflowReplicaMismatch
            expr: |
              kube_deployment_status_replicas_available{namespace="payflow"}
              <
              kube_deployment_spec_replicas{namespace="payflow"}
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Deployment replica mismatch"
              description: "Available replicas are below desired count."
      - name: payflow.saturation
        rules:
          - alert: PayflowHighCPUThrottling
            expr: |
              (
                sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace="payflow",container!=""}[5m]))
                /
                clamp_min(sum by (pod) (rate(container_cpu_cfs_periods_total{namespace="payflow",container!=""}[5m])), 0.001)
              ) > 0.25
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU throttling detected (pod: {{ $labels.pod }})"
              description: "CPU throttling above 25% for pod {{ $labels.pod }}. CPU limits may be too low."
          - alert: PayflowCPUUsageNearLimit
            expr: |
              (
                sum(rate(container_cpu_usage_seconds_total{namespace="payflow",container!=""}[5m])) by (pod)
                /
                sum(kube_pod_container_resource_limits{namespace="payflow",resource="cpu"}) by (pod)
              ) > 0.9
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod CPU usage near limit"
              description: "Pod CPU usage exceeds 90% of configured limits."
          - alert: PayflowMemoryUsageNearLimit
            expr: |
              (
                sum(container_memory_working_set_bytes{namespace="payflow",container!=""}) by (pod)
                /
                sum(kube_pod_container_resource_limits{namespace="payflow",resource="memory"}) by (pod)
              ) > 0.9
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod memory usage near limit"
              description: "Pod memory usage exceeds 90% of configured limits."
      - name: payflow.infrastructure
        rules:
          - alert: PayflowScrapeTargetDown
            expr: up{namespace="payflow"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Scrape target down (service: {{ $labels.service }})"
              description: "Prometheus scrape target {{ $labels.instance }} has been down for more than 5 minutes."
          - alert: PayflowNodeHighCPU
            expr: |
              100 * (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) by (instance)) > 90
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Node CPU above 90%"
              description: "Node CPU utilization is above 90%."
          - alert: PayflowNodeMemoryPressure
            expr: |
              100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 90
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node memory pressure detected"
              description: "Node memory usage is above 90%."
      - name: payflow.dependencies
        rules:
          # #### Dependency health alerts consumed by the Data Dependencies dashboard row. ####
          - alert: PostgresDependencyDown
            expr: |
              max(pg_up{namespace="payflow"}) == 0
              or
              absent(pg_up{namespace="payflow"})
            for: 3m
            labels:
              severity: critical
              service: postgres
              dependency: postgres
            annotations:
              summary: "Postgres dependency is unavailable"
              description: "postgres-exporter reports PostgreSQL as down or the metric is missing."
          - alert: PostgresConnectionsHigh
            expr: |
              100 * (
                sum(pg_stat_database_numbackends{namespace="payflow",datname="payflow"})
                /
                clamp_min((max(pg_settings_max_connections{namespace="payflow"}) or vector(100)), 1)
              ) > 70
            for: 10m
            labels:
              severity: warning
              service: postgres
              dependency: postgres
            annotations:
              summary: "Postgres connection usage above 70%"
              description: "Connection usage is high relative to max_connections for payflow DB."
          - alert: PostgresConnectionsCritical
            expr: |
              100 * (
                sum(pg_stat_database_numbackends{namespace="payflow",datname="payflow"})
                /
                clamp_min((max(pg_settings_max_connections{namespace="payflow"}) or vector(100)), 1)
              ) > 85
            for: 5m
            labels:
              severity: critical
              service: postgres
              dependency: postgres
            annotations:
              summary: "Postgres connection usage above 85%"
              description: "Postgres is close to exhausting connection capacity."
          - alert: RedisDependencyDown
            expr: |
              max(redis_up{namespace="payflow"}) == 0
              or
              absent(redis_up{namespace="payflow"})
            for: 3m
            labels:
              severity: critical
              service: redis
              dependency: redis
            annotations:
              summary: "Redis dependency is unavailable"
              description: "redis-exporter reports Redis as down or the metric is missing."
          - alert: RedisMemoryUsageHigh
            expr: |
              (
                100 * (
                  max(redis_memory_used_bytes{namespace="payflow"})
                  /
                  max(redis_memory_max_bytes{namespace="payflow"})
                )
              ) > 75
              and on()
              (max(redis_memory_max_bytes{namespace="payflow"}) > 0)
            for: 10m
            labels:
              severity: warning
              service: redis
              dependency: redis
            annotations:
              summary: "Redis memory usage above 75%"
              description: "Redis is approaching maxmemory; writes may fail with noeviction policy."
          - alert: RedisMemoryUsageCritical
            expr: |
              (
                100 * (
                  max(redis_memory_used_bytes{namespace="payflow"})
                  /
                  max(redis_memory_max_bytes{namespace="payflow"})
                )
              ) > 90
              and on()
              (max(redis_memory_max_bytes{namespace="payflow"}) > 0)
            for: 5m
            labels:
              severity: critical
              service: redis
              dependency: redis
            annotations:
              summary: "Redis memory usage above 90%"
              description: "Redis is near maxmemory; idempotency writes are at risk of OOM rejections."
          - alert: RedisEvictionsDetected
            expr: |
              increase(redis_evicted_keys_total{namespace="payflow"}[10m]) > 0
            for: 2m
            labels:
              severity: critical
              service: redis
              dependency: redis
            annotations:
              summary: "Redis evictions detected"
              description: "Evictions should be zero for idempotency safety; investigate Redis policy/capacity."
          - alert: RabbitMQDependencyDown
            expr: |
              max(rabbitmq_up{namespace="payflow"}) == 0
              or
              absent(rabbitmq_up{namespace="payflow"})
            for: 3m
            labels:
              severity: critical
              service: rabbitmq
              dependency: rabbitmq
            annotations:
              summary: "RabbitMQ dependency is unavailable"
              description: "rabbitmq-exporter reports RabbitMQ as down or the metric is missing."
          - alert: RabbitMQQueueReadyHigh
            expr: |
              sum(rabbitmq_queue_messages_ready{namespace="payflow"}) > 100
            for: 10m
            labels:
              severity: warning
              service: rabbitmq
              dependency: rabbitmq
            annotations:
              summary: "RabbitMQ ready queue backlog is high"
              description: "Ready messages are accumulating; consumers may be falling behind."
          - alert: RabbitMQQueueReadyCritical
            expr: |
              sum(rabbitmq_queue_messages_ready{namespace="payflow"}) > 500
            for: 5m
            labels:
              severity: critical
              service: rabbitmq
              dependency: rabbitmq
            annotations:
              summary: "RabbitMQ ready queue backlog is critical"
              description: "Large ready-message backlog indicates likely processing delay/user impact."
          - alert: RabbitMQUnackedHigh
            expr: |
              sum(rabbitmq_queue_messages_unacked{namespace="payflow"}) > 100
            for: 10m
            labels:
              severity: warning
              service: rabbitmq
              dependency: rabbitmq
            annotations:
              summary: "RabbitMQ unacked messages are high"
              description: "Consumers are holding many in-flight messages; possible slow processing."
          - alert: RabbitMQUnackedCritical
            expr: |
              sum(rabbitmq_queue_messages_unacked{namespace="payflow"}) > 300
            for: 5m
            labels:
              severity: critical
              service: rabbitmq
              dependency: rabbitmq
            annotations:
              summary: "RabbitMQ unacked messages are critical"
              description: "In-flight message count is very high; consumer bottleneck likely."
      - name: payflow.wallet-kpi
        rules:
          - alert: PayflowTransferSuccessRateLow
            expr: |
              (
                100 * (
                  sum(rate(transfers_total{namespace="payflow",status=~"success|completed"}[10m]))
                  /
                  clamp_min(sum(rate(transfers_total{namespace="payflow"}[10m])), 0.001)
                )
              ) < 97
              and
              sum(rate(transfers_total{namespace="payflow"}[10m])) > 0.02
            for: 15m
            labels:
              severity: warning
              service: wallet
            annotations:
              summary: "Transfer success rate below 97%"
              description: "Transfer success ratio is degraded over 10m while traffic is non-trivial."
          - alert: PayflowTransferSuccessRateCritical
            expr: |
              (
                100 * (
                  sum(rate(transfers_total{namespace="payflow",status=~"success|completed"}[10m]))
                  /
                  clamp_min(sum(rate(transfers_total{namespace="payflow"}[10m])), 0.001)
                )
              ) < 90
              and
              sum(rate(transfers_total{namespace="payflow"}[10m])) > 0.05
            for: 10m
            labels:
              severity: critical
              service: wallet
            annotations:
              summary: "Transfer success rate below 90%"
              description: "Severe transfer failure rate with meaningful traffic; user impact is likely."
          - alert: PayflowFailedTransfersHigh
            expr: |
              sum(increase(failed_transfers_total{namespace="payflow"}[10m])) > 20
            for: 10m
            labels:
              severity: warning
              service: wallet
            annotations:
              summary: "Failed transfers are elevated"
              description: "More than 20 failed transfers were recorded in 10 minutes."
          - alert: PayflowFailedTransfersCritical
            expr: |
              sum(increase(failed_transfers_total{namespace="payflow"}[5m])) > 50
            for: 5m
            labels:
              severity: critical
              service: wallet
            annotations:
              summary: "Failed transfers are critically high"
              description: "More than 50 failed transfers in 5 minutes indicates a severe transaction-path issue."
          - alert: PayflowTransactionQueueDepthHigh
            expr: |
              max(queue_depth{namespace="payflow",queue_name="transactions"}) > 50
            for: 10m
            labels:
              severity: warning
              service: transaction
            annotations:
              summary: "Transaction queue depth is high"
              description: "Transaction queue backlog has been above 50 for 10 minutes."
          - alert: PayflowTransactionQueueDepthCritical
            expr: |
              max(queue_depth{namespace="payflow",queue_name="transactions"}) > 150
            for: 5m
            labels:
              severity: critical
              service: transaction
            annotations:
              summary: "Transaction queue depth is critical"
              description: "Transaction queue backlog exceeded 150; settlement delays are likely."
          - alert: PayflowSignupFailureRateHigh
            expr: |
              (
                sum(rate(user_signups_total{namespace="payflow",status="failed"}[15m]))
                /
                clamp_min(sum(rate(user_signups_total{namespace="payflow"}[15m])), 0.001)
              ) > 0.30
              and
              sum(rate(user_signups_total{namespace="payflow"}[15m])) > 0.01
            for: 15m
            labels:
              severity: warning
              service: auth
            annotations:
              summary: "Signup failure rate above 30%"
              description: "A large share of signup attempts are failing over a sustained window."
          - alert: PayflowInsufficientFundsSurge
            expr: |
              sum(increase(failed_transfers_total{namespace="payflow",reason="insufficient_funds"}[15m])) > 30
            for: 15m
            labels:
              severity: warning
              service: wallet
            annotations:
              summary: "Insufficient-funds failures surged"
              description: "Insufficient-funds transfer failures exceeded 30 in 15 minutes."
      - name: payflow.blackbox
        rules:
          - alert: PayflowBlackboxProbeFailure
            expr: probe_success{job="blackbox-http"} == 0
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "Blackbox probe failure (service: {{ $labels.service }})"
