# ============================================
# PROMETHEUS HELM VALUES
# ============================================
# #### Baseline Prometheus configuration for small EKS/MicroK8s clusters. ####

# Disable Alertmanager for lightweight setups (can be enabled later).
alertmanager:
  enabled: false

# ============================================
# PROMETHEUS SERVER
# ============================================
server:
  retention: 7d
  retentionSize: 5GB

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  persistentVolume:
    enabled: true
    size: 8Gi
    storageClass: gp2

  service:
    type: ClusterIP

  # Keep default scrape settings; override only if needed.
  global:
    scrape_interval: 30s
    evaluation_interval: 30s

# ============================================
# KUBE-STATE-METRICS + NODE-EXPORTER
# ============================================
kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# ============================================
# PUSHGATEWAY
# ============================================
pushgateway:
  enabled: true
