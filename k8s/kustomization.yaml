apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

  - configmaps/app-config.yaml
  - configmaps/db-migrations.yaml
  - secrets/db-secrets.yaml

  - payflow-services/api-gateway.yaml
  - payflow-services/auth-service.yaml
  - payflow-services/wallet-service.yaml
  - payflow-services/transaction-service.yaml
  - payflow-services/notification-service.yaml
  - payflow-services/frontend.yaml

  - services/all-services.yaml

  # Managed by Terraform + ExternalName services in overlays.
  # - infrastructure/postgres.yaml
  # - infrastructure/redis.yaml
  # - infrastructure/rabbitmq.yaml
  # Metrics Server is installed via platform-addons (Helm).
  # - infrastructure/metrics-server.yaml

  - ingress/http-ingress.yaml

  - autoscaling/hpa.yaml

  - jobs/db-migration-job.yaml
  - jobs/db-backup-cronjob.yaml
  - jobs/pushgateway-metrics.yaml
  - jobs/transaction-timeout-handler.yaml

  - policies/limit-range.yaml
  - policies/network-policies.yaml
  - policies/pod-disruption-budgets.yaml
  - policies/resource-quotas.yaml
