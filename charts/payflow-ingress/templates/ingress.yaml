apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "payflow-ingress.name" . }}
  namespace: {{ .Values.namespace | quote }}
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.aws.scheme | quote }}
    alb.ingress.kubernetes.io/target-type: {{ .Values.aws.targetType | quote }}
    {{- if .Values.httpOnly }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: {{ required "aws.certificateArn is required when httpOnly=false" .Values.aws.certificateArn | quote }}
    {{- end }}
    {{- if .Values.aws.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ .Values.aws.wafAclArn | quote }}
    {{- end }}
    {{- if .Values.aws.securityGroups }}
    alb.ingress.kubernetes.io/security-groups: {{ .Values.aws.securityGroups | quote }}
    {{- end }}
    {{- if .Values.aws.healthcheckPath }}
    alb.ingress.kubernetes.io/healthcheck-path: {{ .Values.aws.healthcheckPath | quote }}
    {{- end }}
    {{- if .Values.aws.cors.allowOrigin }}
    alb.ingress.kubernetes.io/cors-allow-origin: {{ .Values.aws.cors.allowOrigin | quote }}
    {{- end }}
    {{- if .Values.aws.cors.allowMethods }}
    alb.ingress.kubernetes.io/cors-allow-methods: {{ .Values.aws.cors.allowMethods | quote }}
    {{- end }}
    {{- if .Values.aws.cors.allowHeaders }}
    alb.ingress.kubernetes.io/cors-allow-headers: {{ .Values.aws.cors.allowHeaders | quote }}
    {{- end }}
    {{- if .Values.aws.cors.allowCredentials }}
    alb.ingress.kubernetes.io/cors-allow-credentials: {{ .Values.aws.cors.allowCredentials | quote }}
    {{- end }}
    {{- with .Values.aws.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
  {{- if not .Values.httpOnly }}
  - host: {{ required "domains.app is required" .Values.domains.app | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.frontend.name | quote }}
            port:
              number: {{ .Values.services.frontend.port }}
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.apiGateway.name | quote }}
            port:
              number: {{ .Values.services.apiGateway.port }}
  - host: {{ required "domains.api is required" .Values.domains.api | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.apiGateway.name | quote }}
            port:
              number: {{ .Values.services.apiGateway.port }}
  {{- else }}
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.frontend.name | quote }}
            port:
              number: {{ .Values.services.frontend.port }}
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.services.apiGateway.name | quote }}
            port:
              number: {{ .Values.services.apiGateway.port }}
  {{- end }}
