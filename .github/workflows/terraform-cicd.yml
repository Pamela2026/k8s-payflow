name: terraform-cicd

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

  workflow_call:
    inputs:
      env:
        description: Target environment
        required: true
        type: string

  push:
    branches:
      - main
      - test
    paths:
      - 'terraform/**'
      - 'charts/**'
      - '.github/workflows/terraform-cicd.yml'

concurrency:
  group: terraform-cicd-${{ inputs.env || github.event.inputs.env || 'dev' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.8.5"
  BASTION_REPO_DIR_DEFAULT: /home/ssm-user/k8s-payflow

jobs:
  policy_summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Render contract policy summary
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pipeline-contracts.py >> "$GITHUB_STEP_SUMMARY"
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: policy_summary

    strategy:
      fail-fast: false
      matrix:
        layer:
          - foundation
          - platform/infra
          # - edge  # disabled for now; direct ALB access only

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Create Terraform plugin cache dir
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/${{ matrix.layer }}
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false 
          terraform validate

  helm_lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0
        with:
          version: v3.15.4

      - name: Helm lint ingress chart
        run: |
          set -euo pipefail
          helm lint charts/payflow-ingress \
            -f charts/payflow-ingress/values-${{ inputs.env || github.event.inputs.env || 'dev' }}.yaml

  discover_bastion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - apply_foundation

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-platform-verify

    outputs:
      bastion_instance_id: ${{ steps.bastion.outputs.bastion_instance_id }}

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover Bastion Instance Id
        id: bastion
        env:
          TARGET_ENV: ${{ inputs.env || github.event.inputs.env || 'dev' }}
        run: |
          set -euo pipefail

          mapfile -t IDS < <(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Name,Values=*-${TARGET_ENV}-bastion" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | grep -v '^$')

          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No running bastion found for env=${TARGET_ENV}" >&2
            exit 1
          fi

          if [ "${#IDS[@]}" -gt 1 ]; then
            echo "Multiple running bastions found for env=${TARGET_ENV}: ${IDS[*]}" >&2
            echo "Expected exactly one. Resolve before re-running." >&2
            exit 1
          fi

          echo "bastion_instance_id=${IDS[0]}" >> "$GITHUB_OUTPUT"

  plan_foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - precheck
      - helm_lint

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-foundation-plan

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Create Terraform plugin cache dir
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:   
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform Plan
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out=tfplan \
            -var-file=terraform.tfvars

          terraform show -no-color tfplan > plan.txt

      - name: Upload foundation plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: foundation-plan
          path: |
            terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation/tfplan
            terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation/plan.txt

  apply_foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs: plan_foundation

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-foundation-apply

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Create Terraform plugin cache dir
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: foundation-plan
          path: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation

      - name: Terraform Apply
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/foundation
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan

  plan_platform:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs: apply_foundation

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-platform-plan

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Create Terraform plugin cache dir
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra
        run: |
          set -euo pipefail
          terraform init -input=false 

      - name: Terraform Plan
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra
        run: |
          set -euo pipefail

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out=tfplan \
            -var-file=terraform.tfvars

          terraform show -no-color tfplan > plan.txt

      - name: Upload platform plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: platform-plan
          path: |
            terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra/tfplan
            terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra/plan.txt

  apply_platform:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs: plan_platform

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-platform-apply

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Create Terraform plugin cache dir
        run: |
          mkdir -p $HOME/.terraform.d/plugin-cache
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >> $GITHUB_ENV

      - name: Cache Terraform providers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download platform plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: platform-plan
          path: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra

      - name: Terraform Apply
        working-directory: terraform/environments/${{ inputs.env || github.event.inputs.env || 'dev' }}/platform/infra
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve tfplan

  apply_addons:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - apply_platform
      - discover_bastion

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-platform-apply

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Apply platform/addons via Bastion
        env:
          TARGET_ENV: ${{ inputs.env || github.event.inputs.env || 'dev' }}
          GITHUB_SHA: ${{ github.sha }}
          BASTION_INSTANCE_ID: ${{ needs.discover_bastion.outputs.bastion_instance_id }}
          BASTION_REPO_DIR: ${{ secrets.BASTION_REPO_DIR }}
        run: |
          set -euo pipefail

          BASTION_REPO_DIR="${BASTION_REPO_DIR:-${BASTION_REPO_DIR_DEFAULT}}"

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${BASTION_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "platform/addons apply ${TARGET_ENV}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd \"'"${BASTION_REPO_DIR}"'\"",
              "git fetch --all --tags",
              "git checkout '"${GITHUB_SHA}"'",
              "bash terraform/environments/'"${TARGET_ENV}"'/platform/infra/scripts/kcfg.sh",
              "cd terraform/environments/'"${TARGET_ENV}"'/platform/addons",
              "terraform init -input=false -reconfigure",
              "terraform apply -input=false -auto-approve -var-file=terraform.tfvars"
            ]' \
            --query "Command.CommandId" \
            --output text)

          STATUS=""
          for _ in $(seq 1 90); do
            STATUS="$(aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"
            case "${STATUS}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm list-command-invocations \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' \
            --output text

          [ "${STATUS}" = "Success" ] || { echo "SSM command status: ${STATUS}"; exit 1; }

  health_platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - apply_addons
      - discover_bastion

    environment: ${{ inputs.env || github.event.inputs.env || 'dev' }}-platform-verify

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EKS Cluster
        env:
          TARGET_ENV: ${{ inputs.env || github.event.inputs.env || 'dev' }}
          CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
        run: |
          set -euo pipefail

          CLUSTER_NAME="${CLUSTER_NAME:-payflow-eks-${TARGET_ENV}}"

          STATUS="$(aws eks describe-cluster \
            --name "${CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query 'cluster.status' \
            --output text)"

          [ "${STATUS}" = "ACTIVE" ]

      - name: Verify Cluster Access From Bastion
        env:
          TARGET_ENV: ${{ inputs.env || github.event.inputs.env || 'dev' }}
          GITHUB_SHA: ${{ github.sha }}
          BASTION_INSTANCE_ID: ${{ needs.discover_bastion.outputs.bastion_instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${BASTION_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /home/ssm-user/k8s-payflow",
              "git fetch --all --tags",
              "git checkout '"${GITHUB_SHA}"'",
              "bash terraform/environments/'"${TARGET_ENV}"'/platform/infra/scripts/kcfg.sh",
              "kubectl wait --for=condition=Ready nodes --all --timeout=5m"
            ]' \
            --query "Command.CommandId" \
            --output text)

          STATUS=""
          for _ in $(seq 1 90); do
            STATUS="$(aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"
            case "${STATUS}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          [ "${STATUS}" = "Success" ] || { echo "SSM command status: ${STATUS}"; exit 1; }

      - name: Bootstrap Argo CD via Bastion
        env:
          ARGOCD_VERSION: "v2.14.9"
          GITHUB_SHA: ${{ github.sha }}
          BASTION_INSTANCE_ID: ${{ needs.discover_bastion.outputs.bastion_instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${BASTION_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /home/ssm-user/k8s-payflow",
              "git checkout '"${GITHUB_SHA}"'",

              "kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -",

              "kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/'"${ARGOCD_VERSION}"'/manifests/install.yaml",

              "kubectl -n argocd wait --for=condition=Available deployment/argocd-server --timeout=5m",

              "kubectl apply -n argocd -f k8s/argocd/apps/app-of-apps.yaml"
            ]' \
            --query "Command.CommandId" \
            --output text)

          STATUS=""
          for _ in $(seq 1 90); do
            STATUS="$(aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"
            case "${STATUS}" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          [ "${STATUS}" = "Success" ] || { echo "SSM command status: ${STATUS}"; exit 1; }
