name: generate-terraform-locks

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: write

env:
  TF_VERSION: "1.8.5"

jobs:
  generate-locks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        layer:
          - foundation
          - platform/infra
          - platform/addons
          # - edge

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Generate lock file
        working-directory: terraform/environments/${{ inputs.env }}/${{ matrix.layer }}
        run: |
          terraform providers lock \
            -platform=linux_amd64 \
            -platform=darwin_amd64 \
            -platform=windows_amd64

      - name: Upload lock file artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: lock-${{ inputs.env }}-${{ matrix.layer == 'platform/infra' && 'platform-infra' || matrix.layer == 'platform/addons' && 'platform-addons' || matrix.layer }}
          path: terraform/environments/${{ inputs.env }}/${{ matrix.layer }}/.terraform.lock.hcl

  commit-locks:
    runs-on: ubuntu-latest
    needs: generate-locks

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all lock artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: /tmp/locks

      - name: Copy lock files into place
        run: |
          cp /tmp/locks/lock-${{ inputs.env }}-foundation/.terraform.lock.hcl \
             terraform/environments/${{ inputs.env }}/foundation/.terraform.lock.hcl
          cp /tmp/locks/lock-${{ inputs.env }}-platform-infra/.terraform.lock.hcl \
             terraform/environments/${{ inputs.env }}/platform/infra/.terraform.lock.hcl
          cp /tmp/locks/lock-${{ inputs.env }}-platform-addons/.terraform.lock.hcl \
             terraform/environments/${{ inputs.env }}/platform/addons/.terraform.lock.hcl

      - name: Commit and push lock files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terraform/environments/${{ inputs.env }}/**/.terraform.lock.hcl
          if git diff --cached --quiet; then
            echo "Lock files unchanged, nothing to commit."
          else
            git commit -m "chore(terraform): regenerate ${{ inputs.env }} lock files [skip ci]"
            git push
          fi
