name: terraform-drift

on:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read
  issues: write

env:
  TF_VERSION: "1.8.5"

jobs:
  drift:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        layer:
          - foundation
          - platform/infra
          # - edge  # disabled for now; direct ALB access only

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            **/.terraform
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
          role-session-name: drift-${{ github.run_id }}

      - name: Terraform Init
        working-directory: terraform/environments/${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}/${{ matrix.layer }}
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Terraform Drift Check
        id: plan
        working-directory: terraform/environments/${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}/${{ matrix.layer }}
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -var-file=terraform.tfvars
          EXIT_CODE=$?

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "No drift detected"
            exit 0
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "DRIFT DETECTED"
            exit 1
          else
            echo "Terraform error"
            exit $EXIT_CODE
          fi

      - name: Report Drift
        if: failure()
        run: |
          echo "Drift detected in layer: ${{ matrix.layer }}"
          echo "Run locally:"
          echo "terraform -chdir=terraform/environments/${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}/${{ matrix.layer }} plan -var-file=terraform.tfvars"

  notify:
    runs-on: ubuntu-latest
    needs: drift
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Create drift alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const env = `${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}`;
            const title = `Terraform drift detected (${env})`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query });

            if (found.data.total_count > 0) {
              core.info(`Open drift issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `Scheduled drift check failed for \`${env}\`.`,
                ``,
                `Workflow: ${context.workflow}`,
                `Run: ${context.runNumber}`,
                `URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Please review the failed layer(s) in the Actions logs and reconcile state.`
              ].join('\n')
            });
