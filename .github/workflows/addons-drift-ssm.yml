name: addons-drift-ssm

on:
  schedule:
    - cron: '30 6 * * *' # daily 06:30 UTC
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read
  issues: write

concurrency:
  group: addons-drift-${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722  # v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Discover Bastion Instance Id
        id: bastion
        env:
          AWS_REGION: us-east-1
          TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}
        run: |
          set -euo pipefail

          mapfile -t IDS < <(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --filters \
              "Name=tag:Name,Values=*-${TARGET_ENV}-bastion" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | grep -v '^$')

          if [ "${#IDS[@]}" -eq 0 ]; then
            echo "No running bastion found for env=${TARGET_ENV}" >&2
            exit 1
          fi

          if [ "${#IDS[@]}" -gt 1 ]; then
            echo "Multiple running bastions found for env=${TARGET_ENV}: ${IDS[*]}" >&2
            echo "Expected exactly one. Resolve before re-running." >&2
            exit 1
          fi

          echo "bastion_instance_id=${IDS[0]}" >> "$GITHUB_OUTPUT"

      - name: Terraform Drift Check (platform/addons via bastion)
        env:
          AWS_REGION: us-east-1
          TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}
          BASTION_REPO_DIR: ${{ secrets.BASTION_REPO_DIR }}
        run: |
          set -euo pipefail

          BASTION_REPO_DIR="${BASTION_REPO_DIR:-/home/ssm-user/k8s-payflow}"
          BASTION_INSTANCE_ID="${{ steps.bastion.outputs.bastion_instance_id }}"

          read -r -d '' COMMANDS_JSON <<EOF || true
          {
            "commands": [
              "set -euo pipefail",
              "cd \"${BASTION_REPO_DIR}\"",
              "git pull --ff-only || true",
              "cd terraform/environments/${TARGET_ENV}/platform/addons",

              "terraform init -input=false -reconfigure",

              "set +e",
              "terraform plan -input=false -no-color -detailed-exitcode -var-file=terraform.tfvars",
              "EC=$?",
              "set -e",

              "echo exit_code=\$EC",

              "if [ \$EC -eq 2 ]; then echo DRIFT_DETECTED; exit 2; fi",
              "if [ \$EC -eq 1 ]; then echo PLAN_ERROR; exit 1; fi"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${BASTION_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "addons drift check" \
            --parameters "${COMMANDS_JSON}" \
            --query 'Command.CommandId' \
            --output text)

          STATUS=""
          for _ in $(seq 1 90); do
            STATUS="$(aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"

            if [ "${STATUS}" = "Success" ] || [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ] || [ "${STATUS}" = "TimedOut" ]; then
              break
            fi

            sleep 10
          done

          STATUS=$(aws ssm list-command-invocations \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --details \
            --query 'CommandInvocations[0].Status' \
            --output text)

          if [ "${STATUS}" != "Success" ]; then
            aws ssm list-command-invocations \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --details \
              --output json
            exit 1
          fi

          OUT=$(aws ssm list-command-invocations \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' \
            --output text)

          echo "$OUT"

          if echo "$OUT" | grep -q "DRIFT_DETECTED"; then
            echo "Drift detected in platform/addons"
            exit 1
          fi

          if echo "$OUT" | grep -q "PLAN_ERROR"; then
            echo "Terraform plan error"
            exit 1
          fi

          echo "No drift detected"

  notify:
    runs-on: ubuntu-latest
    needs: drift
    if: failure() && github.event_name == 'schedule'

    steps:
      - name: Create drift alert issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const env = `${{ github.event_name == 'workflow_dispatch' && inputs.env || 'dev' }}`;
            const title = `Addons drift detected (${env})`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q: query });

            if (found.data.total_count > 0) {
              core.info(`Open drift issue already exists: ${title}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `Scheduled addons drift check failed for \`${env}\`.`,
                ``,
                `Workflow: ${context.workflow}`,
                `Run: ${context.runNumber}`,
                `URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `Please review the bastion-run Terraform output in the workflow logs and reconcile state.`
              ].join('\n')
            });
