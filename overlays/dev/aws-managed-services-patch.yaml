apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: payflow
spec:
  template:
    spec:
      containers:
      - name: auth-service
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: DB_NAME
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: payflow-secrets
              key: REDIS_URL
---
