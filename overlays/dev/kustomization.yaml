apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      env: dev
      platform: eks

resources:
  - ../../k8s
  - alb-ingress.yaml
  - externalname-services.yaml
  - external-secrets.yaml

patches:
  - path: patch-configmap.yaml
  - path: patch-namespace-label.yaml
  - path: patch-frontend-service.yaml
  - path: patch-backup-pvc-storageclass.yaml
