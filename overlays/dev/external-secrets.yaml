apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payflow-secrets
  namespace: payflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: payflow-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: payflow-dev-db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: payflow-dev-db
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: payflow-dev-jwt
        property: jwt_secret
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: payflow-dev-mq
        property: username
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: payflow-dev-mq
        property: password
