apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow-alb
  namespace: payflow
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '${ALB_LISTEN_PORTS}'
    alb.ingress.kubernetes.io/wafv2-acl-arn: ${WAF_WEB_ACL_ARN}
    alb.ingress.kubernetes.io/ssl-redirect: "${ALB_SSL_REDIRECT}"
    alb.ingress.kubernetes.io/certificate-arn: ${ALB_CERT_ARN}
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
